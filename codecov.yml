coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 1%
    patch:
      default:
        target: 70%

codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

ignore:
  - "bin/"
  - "example/"
  - "test/"
  - "scripts/"
  - "**.g.dart"
  - "**.freezed.dart"
  - "**.mocks.dart"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes

github_checks:
  annotations: true