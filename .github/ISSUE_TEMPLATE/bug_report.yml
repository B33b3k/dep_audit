name: Bug Report
description: File a bug report to help us improve
title: "[BUG] "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 🐛

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checklist
      description: Please verify these before submitting
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I am using the latest version of dep_audit
          required: true
        - label: I have read the documentation
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: Tell us what happened!
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: A clear and concise description of what you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: A clear and concise description of what actually happened
    validations:
      required: true

  - type: textarea
    id: pubspec
    attributes:
      label: Project pubspec.yaml
      description: Please paste your pubspec.yaml (remove sensitive information)
      render: yaml
      placeholder: |
        name: my_project
        version: 1.0.0
        dependencies:
          # your dependencies

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide environment details
      placeholder: |
        - OS: [e.g. macOS 12.6, Ubuntu 20.04, Windows 11]
        - Dart SDK: [e.g. 3.1.0]
        - dep_audit version: [e.g. 0.1.3]
        - Project type: [e.g. Flutter app, Dart package]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Output
      description: Please copy and paste any relevant error output
      render: shell
      placeholder: |
        $ dep_audit --format json
        Error: ...

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: Screenshots, related issues, etc.