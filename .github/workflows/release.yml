# Official pub.dev publishing workflow using GitHub Actions OIDC
name: Publish to pub.dev

on:
  push:
    tags:
      # Must align with tag-pattern configured on pub.dev
      - 'v[0-9]+.[0-9]+.[0-9]+'  # For tags like: v1.2.3

jobs:
  # Official pub.dev publishing using the reusable workflow
  publish:
    name: Publish to pub.dev
    permissions:
      id-token: write # Required for authentication using OIDC
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    # Uncomment if package is in subdirectory:
    # with:
    #   working-directory: path/to/package

  # Create GitHub release after successful pub.dev publishing
  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Extract changelog for version
      id: changelog
      run: |
        # Extract changelog section for this version
        if [[ -f "CHANGELOG.md" ]]; then
          CHANGELOG_CONTENT=$(awk "/^## ${{ steps.version.outputs.VERSION }}/,/^## /{if(/^## ${{ steps.version.outputs.VERSION }}/) p=1; else if(/^## / && p) exit; if(p && !/^## ${{ steps.version.outputs.VERSION }}/) print}" CHANGELOG.md)
          if [[ -n "$CHANGELOG_CONTENT" ]]; then
            echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "CHANGELOG=No changelog entry found for version ${{ steps.version.outputs.VERSION }}" >> $GITHUB_OUTPUT
          fi
        else
          echo "CHANGELOG=See commit history for changes in this release." >> $GITHUB_OUTPUT
        fi

    - name: Create GitHub Release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ github.ref_name }}
        name: "Release ${{ steps.version.outputs.VERSION }}"
        body: |
          ## What's Changed
          
          ${{ steps.changelog.outputs.CHANGELOG }}
          
          ## Installation
          
          ```bash
          dart pub global activate dep_audit
          ```
          
          ## Usage
          
          ```bash
          dep_audit --help
          ```
          
          ## Links
          
          - 📦 [pub.dev Package](https://pub.dev/packages/dep_audit)
          - 📝 [Full Changelog](https://github.com/B33b3k/dep_audit/blob/main/CHANGELOG.md)
          - 🐛 [Report Issues](https://github.com/B33b3k/dep_audit/issues)
        draft: false
        prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
        generateReleaseNotes: true