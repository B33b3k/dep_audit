name: Publish to GitHub Packages

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  publish-github-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Dart SDK
      uses: dart-lang/setup-dart@v1
      with:
        sdk: stable

    - name: Install dependencies
      run: dart pub get

    - name: Run tests
      run: dart test

    - name: Setup GitHub Packages authentication
      run: |
        mkdir -p ~/.pub-cache
        cat <<EOF > ~/.pub-cache/credentials.json
        {
          "accessToken": "${{ secrets.GITHUB_TOKEN }}",
          "refreshToken": "${{ secrets.GITHUB_TOKEN }}",
          "tokenEndpoint": "https://github.com/login/oauth/access_token",
          "scopes": ["read:packages", "write:packages"],
          "expiration": 1893456000000
        }
        EOF

    - name: Create GitHub Packages pubspec
      run: |
        # Create a modified pubspec.yaml for GitHub Packages
        cp pubspec.yaml pubspec-github.yaml
        echo "publish_to: https://pub.pkg.github.com" >> pubspec-github.yaml

    - name: Configure Dart pub credentials
      run: |
        mkdir -p ~/.config/dart
        echo '${{ secrets.GITHUB_TOKEN }}' | dart pub token add https://pub.pkg.github.com

    - name: Publish to GitHub Packages
      run: |
        # Use the GitHub-specific pubspec
        mv pubspec.yaml pubspec-pub.yaml
        mv pubspec-github.yaml pubspec.yaml
        
        # Publish to GitHub Packages
        dart pub publish --force
        
        # Restore original pubspec
        mv pubspec-pub.yaml pubspec.yaml